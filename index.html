<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrushkaStars</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    background:linear-gradient(160deg,#8b35d6,#43106d,#16051f);
    min-height:100vh;
}

button{
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    cursor:pointer;
}

.app{
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding-bottom:90px;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px;

    background:rgba(20,5,30,.94);
    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
    font-size:23px;
    font-weight:900;
}

.logo span{
    color:#d08cff;
}

.balance{
    margin-top:5px;
    color:#f1ddff;
}

.profileBtn{
    border:0;
    border-radius:12px;
    padding:11px 14px;

    background:#913cff;
    color:white;

    font-weight:bold;
}

/* PAGES */

.page{
    display:none;
    padding:20px;
}

.page.active{
    display:block;
}

h1{
    margin:5px 0 20px;
}

/* HOME */

.menu{
    display:grid;
    gap:18px;
}

.menuCard{
    width:100%;
    padding:0;
    overflow:hidden;

    border:1px solid rgba(255,255,255,.13);
    border-radius:20px;

    background:#32134f;
    color:white;

    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.menuCard img{
    width:100%;
    height:240px;
    display:block;
    object-fit:cover;
}

.menuTitle{
    padding:16px;
    font-size:23px;
    font-weight:900;
}

/* BACK */

.back{
    border:0;
    border-radius:10px;
    padding:10px 15px;

    background:#7130b5;
    color:white;
    font-weight:bold;
}

/* CASES */

.cases{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.case{
    padding:12px;

    border-radius:17px;

    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.1);

    text-align:center;
}

.caseIcon{
    height:120px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:14px;

    background:rgba(140,50,230,.25);

    font-size:60px;
}

.case h3{
    margin-bottom:5px;
}

.price{
    color:#e2c5ff;
    margin-bottom:12px;
}

.open{
    width:100%;

    padding:12px;

    border:0;
    border-radius:11px;

    background:linear-gradient(135deg,#a855f7,#6d28d9);

    color:white;
    font-weight:bold;
}

/* PROFILE */

.profileCard{
    padding:20px;

    border-radius:20px;

    background:rgba(255,255,255,.09);

    text-align:center;
}

.avatar{
    font-size:60px;
}

.inventory{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.item{
    padding:12px;

    border-radius:16px;

    background:rgba(255,255,255,.09);

    border:1px solid rgba(255,255,255,.1);
}

.itemIcon{
    height:100px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:12px;

    background:rgba(130,50,230,.25);

    font-size:55px;
}

.sell{
    width:100%;
    padding:10px;

    border:0;
    border-radius:10px;

    background:#22c55e;
    color:white;

    font-weight:bold;
}

/* UPGRADE */

.upgradeImage{
    width:100%;
    max-height:300px;

    object-fit:cover;

    border-radius:18px;
}

.upgradeBox{
    margin-top:15px;
    padding:18px;

    border-radius:18px;

    background:rgba(255,255,255,.09);
}

.upgradeBtn{
    width:100%;
    padding:13px;

    border:0;
    border-radius:12px;

    background:#933cff;

    color:white;
    font-weight:bold;
}

/* BOTTOM */

.bottom{
    position:fixed;
    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:min(520px,100%);

    display:grid;
    grid-template-columns:repeat(4,1fr);

    padding:8px;

    background:rgba(20,5,30,.97);

    border-top:1px solid rgba(255,255,255,.12);

    z-index:50;
}

.bottom button{
    border:0;
    background:transparent;

    color:white;

    padding:7px 2px;

    font-size:20px;
}

.bottom span{
    display:block;
    font-size:11px;
    margin-top:3px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(0,0,0,.78);

    z-index:100;
}

.modal.hidden{
    display:none;
}

.modalBox{
    width:100%;
    max-width:380px;

    padding:25px;

    border-radius:22px;

    background:#2b0d46;

    text-align:center;
}

.winIcon{
    font-size:80px;
}

.modalButton{
    width:100%;
    padding:13px;

    border:0;
    border-radius:12px;

    background:#913cff;

    color:white;
    font-weight:bold;
}

@media(max-width:380px){
    .cases,
    .inventory{
        grid-template-columns:1fr;
    }
}
</style>
</head>

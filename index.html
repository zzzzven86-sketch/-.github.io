<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrushkaStars</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #6d28d9;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        button {
            width: 90%;
            max-width: 350px;
            padding: 18px;
            margin: 10px;
            border: none;
            border-radius: 15px;
            background: #9333ea;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .balance {
            margin: 20px;
            padding: 15px;
            border-radius: 15px;
            background: rgba(255,255,255,0.15);
            font-size: 20px;
        }

        .back {
            background: #4c1d95;
        }
    </style>
</head>

<body>

<header>
    ⭐ TrushkaStars
</header>

<div class="balance">
    Баланс: ⭐ <span id="balance">1000</span>
</div>

<!-- ГЛАВНАЯ -->
<div id="home" class="page active">
    <div class="container">

        <button onclick="openPage('cases')">
            📦 Кейсы
        </button>

        <button onclick="openPage('upgrade')">
            ⚡ Апгрейд
        </button>

        <button onclick="openPage('profile')">
            👤 Профиль
        </button>

    </div>
</div>


<!-- КЕЙСЫ -->
<div id="cases" class="page">
    <div class="container">

        <h1>📦 Кейсы</h1>

        <p>Тестовый кейс</p>
        <p>Цена: ⭐ 100</p>

        <button onclick="openCase()">
            Открыть кейс
        </button>

        <br>

        <button class="back" onclick="openPage('home')">
            ← Назад
        </button>

    </div>
</div>


<!-- АПГРЕЙД -->
<div id="upgrade" class="page">
    <div class="container">

        <h1>⚡ Апгрейд</h1>

        <p>Это тестовый раздел.</p>

        <button onclick="upgrade()">
            Сделать апгрейд
        </button>

        <br>

        <button class="back" onclick="openPage('home')">
            ← Назад
        </button>

    </div>
</div>


<!-- ПРОФИЛЬ -->
<div id="profile" class="page">
    <div class="container">

        <h1>👤 Профиль</h1>

        <p id="items">
            Предметов пока нет.
        </p>

        <button class="back" onclick="openPage('home')">
            ← Назад
        </button>

    </div>
</div>


<script>
    let balance = 1000;
    let items = [];

    function openPage(page) {

        document.querySelectorAll(".page").forEach(function(element) {
            element.classList.remove("active");
        });

        document.getElementById(page).classList.add("active");
    }


    function updateBalance() {

        document.getElementById("balance").textContent = balance;
    }


    function openCase() {

        if (balance < 100) {
            alert("Недостаточно ⭐");
            return;
        }

        balance -= 100;

        const item = "💎 Тестовый предмет";

        items.push(item);

        updateBalance();

        document.getElementById("items").textContent =
            "Получено: " + item;

        alert("🎉 Ты получил " + item);
    }


    function upgrade() {

        alert("⚡ Кнопка апгрейда работает!");
    }


    updateBalance();
</script>

</body>
</html>

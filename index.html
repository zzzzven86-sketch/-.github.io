<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #8b35d6 0%, #40106b 35%, #17051f 100%);
    min-height: 100vh;
}

.app {
    max-width: 520px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 90px;
}

/* Верхняя панель */

.header {
    position: sticky;
    top: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px;
    background: rgba(20, 5, 30, 0.9);
    backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.logo {
    font-size: 23px;
    font-weight: 900;
}

.logo span {
    color: #c084fc;
}

.balance {
    margin-top: 5px;
    color: #ddd;
}

.profile-button {
    border: none;
    border-radius: 12px;
    padding: 11px 14px;

    background: #8b3dff;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

/* Страницы */

.page {
    display: none;
    padding: 20px;
}

.page.active {
    display: block;
}

h1 {
    margin-top: 5px;
    font-size: 28px;
}

/* Главные кнопки */

.menu-grid {
    display: grid;
    gap: 18px;
}

.menu-card {
    overflow: hidden;

    padding: 0;

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;

    background: rgba(255,255,255,0.08);

    color: white;

    cursor: pointer;

    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.menu-card img {
    width: 100%;
    height: 230px;

    display: block;

    object-fit: cover;
}

.menu-card-title {
    padding: 15px;

    font-size: 23px;
    font-weight: 900;
}

/* Кейсы */

.cases {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.case {
    padding: 12px;

    border-radius: 17px;

    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);

    text-align: center;
}

.case-image {
    height: 120px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 14px;

    background: rgba(120,50,220,0.25);

    font-size: 60px;
}

.case h3 {
    margin-bottom: 5px;
}

.case-price {
    color: #d8b4fe;
}

.open-button {
    width: 100%;

    border: none;
    border-radius: 11px;

    padding: 12px;

    background: linear-gradient(135deg,#9b4dff,#6820c7);

    color: white;

    font-weight: bold;

    cursor: pointer;
}

/* Профиль */

.profile {
    padding: 20px;

    border-radius: 20px;

    background: rgba(255,255,255,0.08);

    text-align: center;
}

.avatar {
    font-size: 60px;
}

.inventory {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
}

.item {
    padding: 12px;

    border-radius: 16px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.1);
}

.item-icon {
    height: 100px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background: rgba(130,60,230,0.25);

    font-size: 55px;
}

.sell {
    width: 100%;

    margin-top: 8px;

    padding: 10px;

    border: none;
    border-radius: 10px;

    background: #22c55e;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

/* Апгрейд */

.upgrade-image {
    width: 100%;

    max-height: 300px;

    object-fit: cover;

    border-radius: 18px;
}

.upgrade-box {
    margin-top: 15px;

    padding: 18px;

    border-radius: 18px;

    background: rgba(255,255,255,0.08);
}

.upgrade-button {
    width: 100%;

    padding: 13px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(135deg,#a855f7,#6d28d9);

    color: white;

    font-weight: bold;
}

/* Нижнее меню */

.bottom-menu {
    position: fixed;
    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    width: min(520px,100%);

    display: grid;
    grid-template-columns: repeat(4,1fr);

    padding: 8px;

    background: rgba(20,5,30,0.95);

    backdrop-filter: blur(15px);

    border-top: 1px solid rgba(255,255,255,0.1);

    z-index: 20;
}

.bottom-menu button {
    border: none;

    background: transparent;

    color: white;

    padding: 7px 2px;

    font-size: 20px;

    cursor: pointer;
}

.bottom-menu span {
    display: block;

    font-size: 11px;

    margin-top: 3px;
}

/* Назад */

.back {
    border: none;
    border-radius: 10px;

    padding: 9px 14px;

    background: #7330bd;

    color: white;

    font-weight: bold;
}

/* Окно выигрыша */

.modal {
    position: fixed;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,0.75);

    z-index: 100;
}

.modal.hidden {
    display: none;
}

.modal-box {
    width: 100%;
    max-width: 380px;

    padding: 25px;

    border-radius: 22px;

    background: #2a0d45;

    text-align: center;
}

.win-icon {
    font-size: 80px;
}

.modal-button {
    width: 100%;

    padding: 13px;

    border: none;
    border-radius: 12px;

    background: #8b3dff;

    color: white;

    font-weight: bold;
}

/* Телефон */

@media(max-width:380px) {

    .cases,
    .inventory {
        grid-template-columns: 1fr;
    }

}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

    <div>
        <div class="logo">
            CASE<span>APP</span>
        </div>

        <div class="balance">
            💰 <span id="balance">1000</span>
        </div>
    </div>

    <button class="profile-button"
            onclick="showPage('profile')">
        👤 Профиль
    </button>

</header>


<!-- ГЛАВНОЕ МЕНЮ -->

<section id="home" class="page active">

    <h1>Главное меню</h1>

    <div class="menu-grid">

        <button class="menu-card"
                onclick="showPage('cases')">

            <img src="assets/cases.jpg">

            <div class="menu-card-title">
                🎁 КЕЙСЫ
            </div>

        </button>


        <button class="menu-card"
                onclick="showPage('upgrade')">

            <img src="assets/upgrade.jpg">

            <div class="menu-card-title">
                ⬆️ АПГРЕЙД
            </div>

        </button>

    </div>

</section>


<!-- КЕЙСЫ -->

<section id="cases" class="page">

    <button class="back"
            onclick="showPage('home')">
        ← Назад
    </button>

    <h1>🎁 Кейсы</h1>

    <div class="cases">


        <div class="case">

            <div class="case-image">
                🎁
            </div>

            <h3>Обычный кейс</h3>

            <div class="case-price">
                100 💰
            </div>

            <br>

            <button class="open-button"
                    onclick="openCase('Обычный кейс',100)">
                ОТКРЫТЬ
            </button>

        </div>


        <div class="case">

            <div class="case-image">

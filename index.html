<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Звёзды от Трушки</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, #66199b 0%, transparent 32%),
                linear-gradient(160deg, #08020d, #170522 55%, #07020b);
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            min-height: 100vh;
            padding: 22px 16px 30px;
        }

        /* PROFILE */

        .profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #b735ff, #6418df);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            box-shadow: 0 0 20px rgba(171, 45, 255, .35);
        }

        .username {
            font-size: 15px;
            font-weight: 800;
        }

        .subname {
            color: #8d7c96;
            font-size: 11px;
            margin-top: 3px;
        }

        /* BALANCE */

        .balance {
            padding: 9px 13px;
            border-radius: 13px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.10);
            font-weight: 800;
            font-size: 13px;
        }

        /* TITLE */

        .logo {
            text-align: center;
            margin-top: 34px;
        }

        .logo h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 950;
            letter-spacing: -1px;
            background: linear-gradient(
                90deg,
                #ffffff,
                #e28aff,
                #ffffff
            );
            -webkit-background-clip: text;
            color: transparent;
        }

        .logo p {
            margin: 8px 0 0;
            color: #a995af;
            font-size: 13px;
        }

        /* MAIN CARD */

        .card {
            margin-top: 28px;
            padding: 22px 18px;
            border-radius: 24px;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.09);
            box-shadow: 0 20px 60px rgba(130,0,255,.20);
        }

        .star {
            text-align: center;
            font-size: 65px;
            filter: drop-shadow(0 0 22px #b62dff);
        }

        .card h2 {
            text-align: center;
            margin: 8px 0 5px;
            font-size: 23px;
        }

        .description {
            text-align: center;
            color: #a99aac;
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* BUTTONS */

        .button {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
        }

        .coupon-button {
            background: linear-gradient(135deg, #a72cff, #6919d8);
            box-shadow: 0 8px 25px rgba(147,34,255,.30);
        }

        .deposit-button {
            margin-top: 11px;
            background: linear-gradient(135deg, #7927c8, #45138a);
            box-shadow: 0 8px 25px rgba(115,32,205,.25);
        }

        .button:active {
            transform: scale(.97);
        }

        /* COUPON */

        .coupon {
            display: none;
            margin-top: 18px;
            padding: 14px;
            text-align: center;
            border-radius: 14px;
            background: rgba(0,0,0,.25);
            border: 1px dashed #a83cff;
        }

        .coupon-title {
            color: #9f8da7;
            font-size: 11px;
        }

        .coupon-code {
            margin-top: 7px;
            color: #df9cff;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        /* DEPOSIT */

        .deposit {
            display: none;
            margin-top: 16px;
            padding: 15px;
            border-radius: 16px;
            background: rgba(0,0,0,.25);
        }

        .deposit-title {
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .amounts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .amount {
            padding: 13px 5px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 12px;
            background: rgba(255,255,255,.06);
            color: white;
            font-weight: 800;
            cursor: pointer;
        }

        .amount:active {
            transform: scale(.96);
        }

        /* MENU */

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .menu-button {
            padding: 15px 8px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.045);
            color: white;
            font-size: 13px;
            font-weight: 800;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #67586d;
            font-size: 10px;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- PROFILE -->

    <div class="profile">

        <div class="user">

            <div class="avatar">
                ⭐
            </div>

            <div>
                <div class="username" id="username">
                    Пользователь
                </div>

                <div class="subname">
                    Звёзды от Трушки
                </div>
            </div>

        </div>

        <div class="balance" id="balance">
            ⭐ 0
        </div>

    </div>


    <!-- TITLE -->

    <div class="logo">

        <h1>
            ЗВЁЗДЫ ОТ ТРУШКИ
        </h1>

        <p>
            Твоя система звёзд и бонусов
        </p>

    </div>


    <!-- CARD -->

    <div class="card">

        <div class="star">
            ⭐
        </div>

        <h2>
            Купоны и баланс
        </h2>

        <div class="description">
            Получай уникальные купоны и пополняй баланс
        </div>


        <!-- COUPON BUTTON -->

        <button
            class="button coupon-button"
            onclick="getCoupon()">

            🎁 ПОЛУЧИТЬ КУПОН

        </button>


        <!-- DEPOSIT BUTTON -->

        <button
            class="button deposit-button"
            onclick="showDeposit()">

            ⭐ ПОПОЛНИТЬ БАЛАНС

        </button>


        <!-- COUPON -->

        <div
            class="coupon"
            id="coupon">

            <div class="coupon-title">
                ТВОЙ УНИКАЛЬНЫЙ КОД
            </div>

            <div
                class="coupon-code"
                id="couponCode">
            </div>

        </div>


        <!-- DEPOSIT -->

        <div
            class="deposit"
            id="deposit">

            <div class="deposit-title">
                Выбери количество звёзд
            </div>

            <div class="amounts">

                <button
                    class="amount"
                    onclick="buyStars(50)">
                    ⭐ 50
                </button>

                <button
                    class="amount"
                    onclick="buyStars(100)">
                    ⭐ 100
                </button>

                <button
                    class="amount"
                    onclick="buyStars(250)">
                    ⭐ 250
                </button>

                <button
                    class="amount"
                    onclick="buyStars(500)">
                    ⭐ 500
                </button>

            </div>

        </div>

    </div>


    <!-- MENU -->

    <div class="menu">

        <div class="menu-button">
            ⭐ Баланс
        </div>

        <div class="menu-button">
            🎁 Купоны
        </div>

        <div class="menu-button">
            👤 Профиль
        </div>

        <div class="menu-button">
            ℹ️ Помощь
        </div>

    </div>


    <div class="footer">
        © Звёзды от Трушки
    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /* USER */

    if (
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ) {

        const user =
            tg.initDataUnsafe.user;

        document.getElementById("username")
            .innerText =
            user.first_name || "Пользователь";
    }


    /* COUPON */

    function getCoupon() {

        const chars =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

        let code = "";

        for (let i = 0; i < 8; i++) {

            code += chars[
                Math.floor(
                    Math.random() * chars.length
                )
            ];

        }

        const coupon =
            "TRUSHKA-" + code;

        document.getElementById("couponCode")
            .innerText = coupon;

        document.getElementById("coupon")
            .style.display = "block";

        if (tg.HapticFeedback) {

            tg.HapticFeedback
                .notificationOccurred("success");

        }
    }


    /* DEPOSIT MENU */

    function showDeposit() {

        const deposit =
            document.getElementById("deposit");

        if (deposit.style.display === "block") {

            deposit.style.display = "none";

        } else {

            deposit.style.display = "block";

        }
    }


    /*
       PAYMENT

       Здесь пока открывается сообщение-заглушка.
       Настоящий Telegram Stars invoice
       подключим через бота.
    */

    function buyStars(amount) {

        tg.showAlert(
            "Пополнение на ⭐ " +
            amount +
            " Stars подключим через Telegram-бота."
        );

    }

</script>

</body>
</html>
